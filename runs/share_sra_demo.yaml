## Example config for processing already-anonymized SHARE-seq FASTQs sourced
## from SRA, from the HDMA paper (Liu et al, Nature, 2026).
## prep_sra.smk fetches each declared SRR with prefetch+fastq-dump
## into `data_dir`, then the existing ingest_anonymized.smk -> shareseq.smk
## chain takes over.
##
## Run with (after setting up the environment):
##   sbatch -p wjg,sfgf,biochem run_process_anonymize.sh runs/share_sra_demo.yaml
##
## Sample -> Round1 BC1 regex mappings should come from the dataset's
## published sample metadata (the same regex used when the FASTQs were
## originally demultiplexed per sample). All 96 Round1 barcodes must be
## covered exactly once across the entries below.

output_dir: "/path/to/output/dir"

## Uncomment these lines to do a trial run with only two small test chunks per sample
# chunk_size: 2_000_000
# test_chunks: 2
chunk_size: 20_000_000

## Check the genomes
# importantly, make sure the STAR index is compatible with your STAR version
genome:
  bowtie2: /oak/stanford/groups/wjg/bliu/resources/shareseq_references/hg38/bowtie2/hg38
  star: /oak/stanford/groups/wjg/bliu/resources/shareseq_references/hg38/star # this is for STAR 2.7+
  gene_annotation: /oak/stanford/groups/wjg/bliu/resources/shareseq_references/hg38/gencode.v41.annotation.filtered.gtf
  fasta: /oak/stanford/groups/wjg/bliu/resources/shareseq_references/hg38/hg38.fa

## Uncomment the line below to run in a container
# singularity: "/oak/stanford/groups/wjg/bliu/containers/shareseq_latest.sif"

## Regular expressions for 1st round barcodes that should be mapped to each sample
# Must cover all 1st round barcodes, can use resources like regex101.com to check syntax
# (use a dummy Undetermined sample if some 1st round barcodes are unused)
samples:
  T53_b10_Stomach_PCW20: "A[0-9][0-9]|B[0-9][0-9]|C[0-9][0-9]|D[0-9][0-9]|E[0-9][0-9]|F[0-9][0-9]|G[0-9][0-9]|H[0-9][0-9]"

sequencing:
  b10_sra:
    type: anonymized
    # Directory where prep_sra.smk will land the fetched FASTQs, named per
    # ingest_anonymized.smk's expectations:
    #   {ATAC|RNA}_{SampleID}_anon_{R1|R2}.fastq.gz
    data_dir: data/raw/b10_sra/

    # Optional: map sample -> SRR accession for SRA-sourced fastqs. The SRRs
    # below are the same examples documented in download_SRA.sh.
    # Samples listed in ATAC_samples / RNA_samples but NOT in *_sra below
    # must already be present in data_dir under the expected naming scheme.
    ATAC_sra:
      T53_b10_Stomach_PCW20: SRR36812779   # ATAC
    RNA_sra:
      T53_b10_Stomach_PCW20: SRR36812718   # scRNA

    # Source of truth for which samples ingest_anonymized.smk processes.
    # An entry here without a matching *_sra entry means the file must already
    # exist locally (existing local-files behavior is preserved).
    ATAC_samples:
      - T53_b10_Stomach_PCW20
    RNA_samples:
      - T53_b10_Stomach_PCW20

    # I2 sublibrary indices for split-by-I2 in ingest_anonymized.smk. The
    # anonymize.smk -> merge_samples rule merged per-sublibrary FASTQs into one
    # per-sample upload; we split them back out here so downstream cell IDs
    # carry the original CL{N}_BC1+BC2+BC3 prefix matching the non-anon pipeline
    # and the published cell-type metadata.
    sublibraries:
      ATAC:
        CL65: CTTAATGC
        CL66: GTTATCGT
        CL67: CCCGCAGG
        CL68: AACAATCA
        CL69: TCCGTGCC
        CL70: GAATGATC
        CL71: ATGACCAT
        CL72: TTGGTACG
      RNA:
        CL65: CACGTCTC
        CL66: TTAGGCAA
        CL67: CAAGTTAA
        CL68: TGTTAAAG
        CL69: GGTCTACG
        CL70: CGCAAATA
        CL71: TCCTGGAT
        CL72: CAGGAACA